repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.4.8
  hooks:
    - id: ruff
      args:
        - --fix
        - --show-fixes
        - --exit-non-zero-on-fix
    - id: ruff-format
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
    -   id: mypy
-   repo: https://github.com/aufdenpunkt/pre-commit-js-beautify
    rev: 1.13.0 # represents the used version of JS Beautify as well
    hooks:
    -   id: js-beautify
        files: script\.js
        args: [--end-with-newline] # list of arguments like '--editorconfig', '--end-with-newline', '--wrap-attributes=auto', '--wrap-line-length=120'
-   repo: local
    hooks:
    -   id: check-vendor-versions
        name: check extension/web-app vendor library versions match
        description: >-
            plantuml-extension/package.json vendors the same browser libraries
            (jQuery, Bootstrap, diff, panzoom) that index.html loads from CDN;
            the two are unrelated to each other and drift silently if only one
            is bumped.
        entry: uv run python scripts/check_vendor_versions.py
        language: system
        pass_filenames: false
        files: ^(plantuml-extension/package\.json|src/plantuml_gui/templates/index\.html)$
