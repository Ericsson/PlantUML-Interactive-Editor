name: pre-commit

on:
  pull_request:
    branches: [main, summer]
  push:
    branches: [main, summer]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v3
    - name: Install uv
      run: python -m pip install uv==0.12.3
    - uses: pre-commit/action@v3.0.1
