The frontend's own scripts, in dependency order, for the two pages that load
them: index.html and webview.html.

`prefix` is what "static/..." is relative to. Empty for index.html, which is
served from the same origin as the files. Absolute for the webview, whose page
origin is vscode-webview:// and where a relative src would resolve to nothing.

Order is load-bearing: script.js declares the `let editor` binding and the
render pipeline the rest hang off, and activity.js registers handlers that
assume both. Deliberately excludes static/mode-plantuml.js -- that is Ace's
syntax mode, loaded by Ace itself.
-->

{% macro app_scripts(prefix, hash) -%}
<script src="{{ prefix }}static/script.js?v={{ hash }}"></script>
<script src="{{ prefix }}static/title.js?v={{ hash }}"></script>
<script src="{{ prefix }}static/hover-highlight.js?v={{ hash }}"></script>
<script src="{{ prefix }}static/sequence-message.js?v={{ hash }}"></script>
<script src="{{ prefix }}static/sequence-activation.js?v={{ hash }}"></script>
<script src="{{ prefix }}static/sequence-group.js?v={{ hash }}"></script>
<script src="{{ prefix }}static/sequence-box.js?v={{ hash }}"></script>
<script src="{{ prefix }}static/sequence-operations.js?v={{ hash }}"></script>
<script src="{{ prefix }}static/activity.js?v={{ hash }}"></script>
{%- endmacro %}
