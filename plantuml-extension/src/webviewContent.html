<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="Content-Security-Policy" content="{{csp}}">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>PlantUML Interactive Diagram</title>
{{styleLinks}}
	<style>
		/* The app's CSS is written for the web page's two-pane shell. Here the
		   diagram is the whole panel, so undo the parts that assume a shell. */
		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			overflow: hidden;
			background-color: var(--vscode-editor-background);
			color: var(--vscode-editor-foreground);
			font-family: var(--vscode-font-family);
		}
		#colb-container {
			position: absolute;
			inset: 0;
			overflow: auto;
		}
		#colb {
			padding: 12px;
		}
		#error {
			display: none;
			color: var(--vscode-errorForeground);
			white-space: pre-wrap;
			padding: 12px;
			font-family: var(--vscode-editor-font-family);
		}
	</style>
</head>
<body>
	<div id="error"></div>

	<!-- #colb is the web app's own id for the diagram surface, so the stylesheet
	     served by the sidecar applies to it unchanged. -->
	<div id="colb-container">
		<div id="colb"></div>
	</div>

{{menus}}

	<script nonce="{{nonce}}">
		const diagramEl = document.getElementById('colb');
		const containerEl = document.getElementById('colb-container');
		const errorEl = document.getElementById('error');

		window.addEventListener('message', (event) => {
			const message = event.data;

			if (message.type === 'updateDiagram') {
				errorEl.style.display = 'none';
				errorEl.textContent = '';
				containerEl.style.display = 'block';
				diagramEl.innerHTML = message.svg;
			} else if (message.type === 'renderError') {
				containerEl.style.display = 'none';
				errorEl.style.display = 'block';
				errorEl.textContent = message.message;
			}
		});
	</script>
</body>
</html>
